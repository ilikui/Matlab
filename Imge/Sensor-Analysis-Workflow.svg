<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="460" viewBox="0 0 1500 460" role="img" aria-labelledby="title desc">
<title id="title">Sensor Time-Series Analysis Workflow</title><desc id="desc">Sensor data moves through input validation, robust outlier scoring, smoothing and statistics, then visual inspection and regression tests.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f1b32"/><stop offset="1" stop-color="#1b3655"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#3bd0d6"/><stop offset="1" stop-color="#8292ff"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#83dfe4"/></marker><style>.h{font:700 32px Arial,sans-serif;fill:#f5f8ff}.s{font:400 17px Arial,sans-serif;fill:#b9cbe2}.n{font:700 20px Arial,sans-serif;fill:#f8fbff}.b{font:400 15px Arial,sans-serif;fill:#c6d6e9}.tag{font:700 14px Arial,sans-serif;fill:#10213b}</style></defs>
<rect width="1500" height="460" rx="24" fill="url(#bg)"/><text x="55" y="58" class="h">Sensor Time-Series Analysis</text><text x="58" y="88" class="s">A reproducible pipeline: validate first, analyze second, verify always</text><rect x="55" y="110" width="1390" height="3" rx="2" fill="url(#a)"/>
<g stroke="#83dfe4" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M285 235 H325"/><path d="M555 235 H595"/><path d="M825 235 H865"/><path d="M1095 235 H1135"/></g>
<g>
<rect x="55" y="150" width="230" height="170" rx="18" fill="#223d5d" stroke="#4b6a8b"/><rect x="325" y="150" width="230" height="170" rx="18" fill="#223d5d" stroke="#4b6a8b"/><rect x="595" y="150" width="230" height="170" rx="18" fill="#223d5d" stroke="#4b6a8b"/><rect x="865" y="150" width="230" height="170" rx="18" fill="#223d5d" stroke="#4b6a8b"/><rect x="1135" y="150" width="310" height="170" rx="18" fill="#223d5d" stroke="#4b6a8b"/>
<circle cx="85" cy="180" r="15" fill="#7ce4e6"/><text x="85" y="185" text-anchor="middle" class="tag">1</text><text x="78" y="220" class="n">Input &amp; validate</text><text x="78" y="250" class="b">Time / signal vectors</text><text x="78" y="274" class="b">Lengths, finite values,</text><text x="78" y="296" class="b">strictly increasing time</text>
<circle cx="355" cy="180" r="15" fill="#7ce4e6"/><text x="355" y="185" text-anchor="middle" class="tag">2</text><text x="348" y="220" class="n">Detect candidates</text><text x="348" y="250" class="b">Median absolute</text><text x="348" y="274" class="b">deviation (MAD)</text><text x="348" y="296" class="b">Robust score threshold</text>
<circle cx="625" cy="180" r="15" fill="#7ce4e6"/><text x="625" y="185" text-anchor="middle" class="tag">3</text><text x="618" y="220" class="n">Smooth &amp; summarize</text><text x="618" y="250" class="b">Moving average</text><text x="618" y="274" class="b">Mean / std / min / max</text><text x="618" y="296" class="b">Preserve raw samples</text>
<circle cx="895" cy="180" r="15" fill="#7ce4e6"/><text x="895" y="185" text-anchor="middle" class="tag">4</text><text x="888" y="220" class="n">Visualize</text><text x="888" y="250" class="b">Raw vs. smoothed data</text><text x="888" y="274" class="b">Mark unusual samples</text><text x="888" y="296" class="b">Inspect domain context</text>
<circle cx="1165" cy="180" r="15" fill="#7ce4e6"/><text x="1165" y="185" text-anchor="middle" class="tag">5</text><text x="1158" y="220" class="n">Test &amp; interpret</text><text x="1158" y="250" class="b">Normal and invalid inputs</text><text x="1158" y="274" class="b">Repeatable synthetic data</text><text x="1158" y="296" class="b">Candidate ≠ confirmed fault</text>
</g>
<rect x="55" y="355" width="1390" height="55" rx="14" fill="url(#a)"/><text x="750" y="389" text-anchor="middle" style="font:700 20px Arial,sans-serif;fill:#10213b">RAW DATA → CHECKS → ANALYSIS → PLOT → TESTS</text>
</svg>